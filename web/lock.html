<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès verrouillé — TOUMAI-MD</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1a1035 0%, #05030f 60%, #000 100%);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: #eae6ff;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(20, 14, 42, 0.75);
    border: 1px solid rgba(180, 150, 255, 0.25);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }
  .lock-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  p.sub {
    text-align: center;
    font-size: 13px;
    color: #b3a8e0;
    margin: 0 0 24px;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(180, 150, 255, 0.35);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 15px;
    letter-spacing: 1px;
    outline: none;
    text-transform: uppercase;
  }
  input[type="text"]:focus {
    border-color: #a67bff;
    box-shadow: 0 0 0 3px rgba(166, 123, 255, 0.2);
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7b3fe4, #a67bff);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .msg.error { color: #ff7a7a; }
  .msg.warn { color: #ffc76b; }
  .msg.ok { color: #7affa0; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 16px;
    color: #6f66a3;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(180, 150, 255, 0.2);
  }
  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid rgba(37, 211, 102, 0.4);
    background: rgba(37, 211, 102, 0.08);
    color: #7affa0;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .whatsapp-btn:hover { background: rgba(37, 211, 102, 0.16); }
  .whatsapp-btn:active { transform: scale(0.98); }
  .whatsapp-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: #6f66a3;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h1>Accès restreint</h1>
    <p class="sub">Entrez votre clé d'accès pour continuer</p>

    <form id="lock-form" autocomplete="off">
      <input
        type="text"
        id="key-input"
        placeholder="SEIGNEUR••••••••••••••••••••"
        maxlength="40"
        autofocus
        required
      />
      <button type="submit" id="submit-btn">Déverrouiller</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="divider">ou</div>

    <a class="whatsapp-btn" id="whatsapp-link" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25z"/>
      </svg>
      Je n'ai pas de clé d'accès
    </a>

    <footer>Chaque clé n'est valable qu'une seule fois.</footer>
  </div>

  <script>
    const form = document.getElementById('lock-form');
    const input = document.getElementById('key-input');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    // Bouton "Je n'ai pas de clé d'accès" -> WhatsApp, message poli et
    // professionnel déjà rempli, prêt à envoyer.
    const WHATSAPP_NUMBER = '23591234567';
    const WHATSAPP_MESSAGE =
      "Bonjour, je souhaiterais accéder au site TOUMAI-MD mais je n'ai pas de clé d'accès. " +
      "Pourriez-vous m'en fournir une, s'il vous plaît ? Merci d'avance pour votre aide.";

    document.getElementById('whatsapp-link').href =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

    function setMsg(text, type) {
      msg.textContent = text || '';
      msg.className = 'msg' + (type ? ' ' + type : '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) return;

      btn.disabled = true;
      setMsg('Vérification…', '');

      try {
        const res = await fetch('/api/access/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
        });
        const data = await res.json();

        if (data.status === 'ok') {
          setMsg('Clé acceptée — entrée en cours…', 'ok');
          window.location.href = '/';
          return;
        }

        if (data.status === 'used') {
          setMsg('Cette clé a déjà été utilisée.', 'error');
        } else if (data.status === 'locked') {
          const mins = Math.ceil((data.retryAfterMs || 0) / 60000);
          setMsg(`Trop de tentatives. Réessayez dans ${mins} min.`, 'warn');
        } else {
          setMsg('Clé invalide.', 'error');
        }
      } catch (err) {
        setMsg('Erreur réseau, réessayez.', 'error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
